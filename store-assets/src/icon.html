<!doctype html>
<!-- ?size=128&pad=16 : the mark centred on a transparent square -->
<html><head><meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  img { display: block; }
</style></head>
<body><img id="mark" src="mark.svg" />
<script>
  const p = new URLSearchParams(location.search);
  const size = +p.get("size"), pad = +p.get("pad");
  Object.assign(document.getElementById("mark").style, { width: `${size - 2 * pad}px`, height: `${size - 2 * pad}px`, margin: `${pad}px` });
</script></body></html>
